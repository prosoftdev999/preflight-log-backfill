[task]
name = "afterquery/preflight-log-backfill"

[metadata]
author_name = "Thomas Morison"
author_email = "matiasv931026@gmail.com"
difficulty_explanation = "A front-end platform or API-gateway engineer gets this job when the edge in front of a single-page app answers CORS preflights before logging, and someone needs the preflight traffic back for capacity planning or to judge a CORS change. No log line records the browser's decision: whether a preflight went out depends on the state of Chromium's in-memory preflight cache at that moment, which has to be rebuilt request by request across the shift. The solver gets one shift of a dispatch console, 2 hours 46 minutes long: 32,856 API requests from 24 workstations in the edge's access log (every request header as received, plus response headers), the console host's log of 306 page loads, and the edge's and one upstream service's CORS configuration files as they stood at the end of the shift; 22,115 of the requests had a preflight. The console, edge and partner portals are synthetic; each workstation was headless Chromium 153 driven by Playwright 1.63.0, and the truth is the gateway's own record of the OPTIONS requests it answered, a log kept apart from the shipped one while the shift was recorded. Chromium is installed, so each browser rule can be tested, and a sped-up replay against a stand-in edge can check them together; but a replay only reproduces the browser profiles, tabs and restarts the solver has already assumed, so it cannot check those. Nine separate behaviours each decide a large part of the answer, and the files state none of them. Fetches with cache no-store skip the cache lookup and store nothing; this shows only as the Pragma and Cache-Control fields the browser adds. The reports route ends up with two Access-Control-Max-Age fields, which Chromium cannot parse and treats as 5 seconds rather than 600, 1800 or no caching. The shipped edge.yaml is the end-of-shift revision: until a redeploy 1 hour 33 minutes into the shift the reports route did not append its Max-Age, so report preflights were cached for reports-svc's 1800 s, which shows only in the report responses that lack the appended field. The cache is partitioned by top-level site, so the console's telemetry widget inside partner portals has entries of its own, which shows only by joining each API call's Referer to the console log's iframe loads. URLs of 1024 characters or more are never cached. On the dispatch route the edge reflects Access-Control-Request-Headers, so a read and an assignment on the same job keep evicting each other's entry. Every workstation ran a second, guest browser profile for a while next to the main one, with a cache of its own. Dispatchers opened more desk tabs in the main profile during the shift; tabs of one profile share its cache, so one cache per page load is wrong. And each main browser was restarted two or three times times: the profile on disk keeps the fd_sid cookie and the token, so the restored tabs neither sign in nor look different from a new tab, but the in-memory preflight cache starts empty. A restart shows only as every desk tab of the profile falling silent while the same number of desk page loads appear seconds later, which the data note's statement that a desk tab closes only with its browser makes decisive; one cache per cookie misses it. Measured against the sealed answers with everything else right (facts wrong of 32,856, tests failed of 7): treating every fetch as cache default gets 2,001 wrong and fails 6; reading the reports Max-Age as 600 gets 1,435 wrong and fails 6; reading it as 1800 gets 1,435 wrong and fails 6; reading it as no caching gets 1,601 wrong and fails 6; applying the shipped edge.yaml to the whole shift gets 2,143 wrong and fails 6; one cache per profile with no partition for the partner portals gets 1,903 wrong and fails 6; caching long URLs gets 1,682 wrong and fails 6; treating the dispatch route's reflected headers as the edge's fixed list gets 1,979 wrong and fails 6; one cache per workstation with the two profiles merged gets 2,091 wrong and fails 6; one cache per profile with the restarts ignored gets 2,195 wrong and fails 6; one cache per desk page load gets 2,027 wrong and fails 6. The plausible half-right versions measured either pass completely (no-store still storing; reports cached for 600 s before the redeploy) or fail as badly as the miss (taking the smaller of the two Max-Age values gets 1,435 wrong and fails 6; a 2048-character URL limit gets 1,682 wrong and fails 6; one entry per URL and header set on dispatch gets 1,692 wrong and fails 6; telling profiles apart by bearer token gets 3,977 wrong and fails 6; starting an empty cache at every desk page load and sharing it among the profile's tabs gets 1,827 wrong and fails 6)."
solution_explanation = "solution/solve.py reads only /app/data. It parses edge.yaml and reports-svc.cors.json and builds the exact header fields the edge would send back to each OPTIONS request, including the reflected Access-Control-Allow-Headers on dispatch and the doubled Access-Control-Max-Age on reports. It finds the redeploy as the first report response that carries the edge's appended Access-Control-Max-Age (the last report response without the field and the first with it are 283 s apart) and leaves the appended field out before it. It maps every console page load's pv to its top-level site, from the Referer of the iframe load for /embed/ pages, and to a browser profile: the one whose fd_sid cookie the page's credentialed calls carry, or whose cookie its sign-in sets; partner embeds make no credentialed calls and are put with the main profile. Within a profile it splits the shift into browser runs: a desk page load starts a new run unless an earlier desk tab of the same profile still makes a request after it, since desk tabs close only with their browser. Each (workstation, profile, run, top-level site) has its own cache keyed by full URL, with each entry's expiry, whether the preflighting request was credentialed, and the allowed methods and headers. A request needs a preflight if its method isn't GET, HEAD or POST or it carries a non-safelisted header (Authorization, X-Desk-Trace, Idempotency-Key, or a Content-Type outside the three safelisted types). A request carrying Pragma: no-cache was made with cache no-store and skips the lookup; otherwise a lookup hits only if the entry hasn't expired, is credentialed or the request isn't, allows the method and covers every non-safelisted header, and a failed lookup removes the entry. The result is stored unless the request was no-store or its URL is 1024 characters or more. Max-age is the combined header value parsed as an integer, 5 s if it doesn't parse, capped at 7200. It runs in a few seconds."
verification_explanation = "The verifier runs in its own container and only parses /app/output/preflights.json as JSON (a regular file under a size cap); it runs nothing the agent wrote. The sealed answers in tests/expected.json don't come from the reference solution. The gateway recorded every OPTIONS request it answered, in a log separate from the shipped one, while headless Chromium drove the shift; a request is true when an OPTIONS for the same URL from the same workstation arrived after that workstation's previous API request and before this one. Every workstation, across all its tabs and profiles, made one fetch at a time, so the pairing is unambiguous, and the recording was checked so that each OPTIONS was followed by its own request and no fetch failed. A lab model of the cache, replayed with the recorded arrival times, agrees with the gateway's record on every request, and the recording guard rejects it if any request arrives within 0.12 s of the expiry of the entry it is checked against (the closest is 0.15 s), so timing can't decide an answer. The reference gets all 32,856 answers back from the shipped files alone. There are seven tests: one checks that every rid has a boolean, and six each compare the answers of four workstations (by order of first appearance in the log) and print how many of that group's facts are wrong and the first three ids. Key order, formatting and extra keys are ignored. test.sh writes reward 0 first, writes 1 only when all tests pass, and writes a CTRF report. Against the built images the reference gets 1, and a missing, empty, all-true, all-false or truncated file gets 0, as does each shortcut in the difficulty explanation."
category = "Software"
subcategory = "Frontend"
tags = ["cors", "chromium", "preflight-cache", "http", "access-logs"]
expert_time_estimate_hours = 6
relevant_experience = "For this task I built the recording rig: a small asyncio HTTP server that plays the API edge, the console and three partner portals, with each Playwright browser context sent through its own proxy port so that every request is tied to a workstation. I also built the generator that plans a shift of console traffic per workstation, including extra desk tabs and browser restarts that reopen a profile from its stored state, and the assembler that pairs the gateway's OPTIONS record with the access log. Before building on them I probed Chromium 153's network service for each preflight-cache behaviour used here: cache-mode bypass, top-frame partitioning, the 1024-character URL limit, eviction on a failed lookup, the doubled Max-Age, a cache shared by the tabs of one context, separate caches per browser context, an empty cache in a context reopened from its stored state, and no eviction with a few hundred entries."

